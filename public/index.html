<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flatform</title>
<link rel="icon" href="/img/icon-small.svg">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/screens.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="win">
  <header class="titlebar">
    <div class="tt"><img src="/img/icon-small.svg" alt="" width="18" height="18">Flatform</div>
    <div class="tr" id="tripoStatus"></div>
  </header>
  <div class="body">
    <nav class="rail" aria-label="Main">
      <img class="lgimg" src="/img/icon.svg" alt="Flatform">
      <div id="railLinks"></div>
      <a class="ri acct" id="railTripo" href="#/settings"><span class="dot wait"></span><span>Tripo</span></a>
    </nav>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<dialog id="keyDialog" aria-labelledby="keyTitle">
  <form id="keyForm" method="dialog">
    <h2 id="keyTitle">Connect your Tripo account</h2>
    <p class="muted">Paste an API key from <a href="https://developers.tripo3d.com/en/keys" target="_blank" rel="noopener">developers.tripo3d.com/en/keys</a>. It is stored encrypted on this computer and is only sent to Tripo.</p>
    <label class="field-label" for="keyInput">API key</label>
    <input id="keyInput" class="inp mono" type="password" placeholder="tsk_…" autocomplete="off" spellcheck="false" required autofocus>
    <div id="keyError" class="form-error" role="alert"></div>
    <div class="row"><button class="btn ghostbtn" type="button" id="keyCancel">Cancel</button><button class="btn pri" type="submit">Save key</button></div>
  </form>
</dialog>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p class="muted" id="confirmText"></p>
    <div class="row"><button class="btn ghostbtn" value="cancel">Cancel</button><button class="btn dangerbtn" value="ok" id="confirmOk"></button></div>
  </form>
</dialog>

<div id="toast" role="alert" hidden></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<input id="filePicker" type="file" accept="image/png,image/jpeg,image/heic,image/heif,.heic,.heif" multiple hidden>
</body>
</html>
